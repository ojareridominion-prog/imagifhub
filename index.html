<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IMAGIFHUB</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@telegram-apps/sdk@7.2.0/dist/core.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    
    <style>
        :root { --bg: #000; --text: #fff; --bar: #1a1a1a; --accent: #9c4dff; }
        body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui; overflow:hidden; transition: 0.3s; }
        
        /* --- Layout Components --- */
        .top-bar { position:fixed; top:0; width:100%; height:56px; background:var(--bar); display:flex; align-items:center; z-index:1000; border-bottom:1px solid rgba(255,255,255,0.1); }
        .cat-bar { position:fixed; top:56px; width:100%; height:48px; background:var(--bar); overflow-x:auto; display:flex; align-items:center; gap:10px; padding:0 12px; z-index:900; scrollbar-width: none; }
        .cat-bar::-webkit-scrollbar { display: none; }
        
        .cat-btn { padding:6px 15px; border-radius:20px; background:#333; font-size:12px; white-space:nowrap; border:none; color:#fff; cursor:pointer; }
        .cat-btn.active { background:var(--accent); font-weight: bold; }

        .menu-panel { position:fixed; left:-100%; width:85%; height:100%; background:var(--bar); z-index:2000; transition:0.4s; padding-top:60px; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        .menu-panel.open { left:0; }
        .menu-link { padding:15px 25px; border-bottom:1px solid rgba(255,255,255,0.05); display:block; text-decoration:none; color:var(--text); font-weight:500; }
        
        #swiper { position:absolute; top:104px; bottom:0; width:100%; z-index:10; }
        .swiper-slide { position: relative; width: 100%; height: 100%; }
        .swiper-slide img { width:100%; height:100%; object-fit:cover; }
        
        .meta-overlay { position:absolute; bottom:50px; left:15px; text-shadow: 2px 2px 5px #000; pointer-events: none; z-index: 15; }

        /* --- Themes --- */
        .theme-white { --bg: #fff; --text: #000; --bar: #f0f0f0; --accent: #9c4dff; }
        .theme-blood { --bg: #1b0000; --text: #ffd6d6; --bar: #290000; --accent: #ff4d4d; }
        .theme-cyan { --bg: #001616; --text: #00ffff; --bar: #002222; --accent: #00ffff; }
        .theme-sky { --bg: #071824; --text: #7fd6ff; --bar: #0c2233; --accent: #7fd6ff; }
        .theme-orange { --bg: #2a1400; --text: #ffb36b; --bar: #3a1d00; --accent: #ff9a3d; }
        .theme-green { --bg: #051f13; --text: #66ffb2; --bar: #08301e; --accent: #66ffb2; }
        .theme-violet { --bg: #16001f; --text: #f0b3ff; --bar: #220033; --accent: #f0b3ff; }

        .theme-grid { display: flex; overflow-x: auto; gap: 15px; padding: 10px 25px; scrollbar-width: none; }
        .theme-circle { flex: 0 0 48px; width: 48px; height: 48px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,.15); cursor: pointer; display: flex; flex-direction: column; }
        .theme-circle div { height: 50%; }

        .premium-box { margin: 15px; padding: 15px; background: linear-gradient(45deg, #9c4dff, #ff4d4d); border-radius: 12px; color: white; text-align: center; }
        .premium-btn-menu { background: white; color: #9c4dff; border: none; padding: 8px 15px; border-radius: 20px; font-weight: bold; margin-top: 10px; cursor: pointer; }

        /* --- Native Ad Styles --- */
        .native-ad {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 3000; width: 85%; max-width: 350px; padding: 20px;
            background: rgba(20, 20, 20, 0.95); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 15px;
        }
        .native-ad img { width: 100%; height: 180px; object-fit: cover; border-radius: 12px; }
        .close-ad-btn { position: absolute; top: 10px; right: 10px; background: rgba(255, 255, 255, 0.2); border: none; color: white; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3001; }
        
        /* --- NEW: Premium Modal Styles --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        
        .premium-card {
            background: linear-gradient(135deg, #1a1a1a, #2c3e50);
            padding: 30px; border-radius: 20px; text-align: center;
            width: 85%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #444;
            transform: scale(0.9); transition: transform 0.3s ease;
        }
        .modal-overlay.active .premium-card { transform: scale(1); }

        .price-tag { margin: 20px 0; font-size: 18px; }
        .new-price { color: #ffd700; font-weight: bold; display: block; font-size: 24px; margin-top: 5px; }
        .old-price { text-decoration: line-through; opacity: 0.5; font-size: 14px; }
        
        .premium-list { text-align: left; opacity: 0.9; margin: 20px 0; padding-left: 20px; }
        .premium-list li { margin-bottom: 8px; list-style: none; }
        .premium-list li::before { content: "⭐ "; }

        .btn-buy {
            background: #ffd700; color: #000; font-weight: bold; border: none;
            padding: 15px; width: 100%; border-radius: 12px; font-size: 16px;
            margin-top: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }
        .btn-close {
            background: transparent; color: #aaa; border: none;
            margin-top: 15px; cursor: pointer; text-decoration: underline;
        }
        .hidden { display: none !important; }

    </style>
</head>
<body>

    <div class="top-bar">
        <button onclick="toggleMenu()" style="background:none; border:none; color:#fff; font-size:24px; padding:15px; cursor:pointer;">☰</button>
        <h2 style="flex:1; text-align:center; font-size:16px; margin:0;">IMAGIFHUB</h2>
        <button id="muteBtn" onclick="toggleMute()" style="background:none; border:none; color:#fff; font-size:22px; padding:15px; cursor:pointer;">🔊</button>
        <button onclick="triggerSearch()" style="background:none; border:none; color:#fff; font-size:22px; padding:15px; cursor:pointer;">🔍</button>
    </div>

    <div class="cat-bar" id="catBar"></div>

    <div id="menuPanel" class="menu-panel">
        <a href="#" class="menu-link" onclick="toggleMenu()" style="color:var(--accent)">✕ Close Menu</a>
        
        <div class="premium-box">
            <div style="font-weight: bold; font-size: 18px;">IMAGIF PREMIUM ⭐</div>
            <div style="font-size: 11px; opacity: 0.9; margin-top: 5px;">Enjoy ad-free smooth scrolling</div>
            <button class="premium-btn-menu" onclick="openPremium()">UPGRADE NOW</button>
        </div>
        
        <a href="#" class="menu-link" onclick="shareBot()">🔗 Share Bot with Friends</a>
        <a href="https://t.me/imagifhub" class="menu-link">📢 Join Official Channel</a> 
        <div style="padding:15px 25px 5px; font-size:12px; opacity:0.6;">SELECT THEME</div>
        <div class="theme-grid" id="themeGrid"></div>
    </div>

    <div id="swiper" class="swiper"><div class="swiper-wrapper" id="feed"></div></div>
    
    <audio id="bgMusic"></audio>

    <div id="nativeAd" class="native-ad hidden" onclick="handleAdClick(event)">
        <button class="close-ad-btn" onclick="hideAd(event)">✕</button>
        <img id="adImage" src="" alt="Ad">
        <div class="ad-text">
            <div id="adTitle" class="ad-title" style="font-size: 18px; font-weight: bold;"></div>
            <div id="adSubtitle" class="ad-subtitle" style="opacity: 0.8; font-size: 14px;"></div>
        </div>
    </div>

    <div id="premiumModal" class="modal-overlay">
        <div class="premium-card">
            <h1>✨ ImagifHub Premium</h1>
            <div class="price-tag">
                <span class="old-price">200 Stars</span>
                <span class="new-price">149 Stars / 30 days</span>
            </div>
            <ul class="premium-list">
                <li>🚫 No ads</li>
                <li>✅ Support ImagifHub</li>
                <li>⚡ Faster Downloads</li>
            </ul>
            <button id="btnBuy" class="btn-buy" onclick="goPremium()">
                Go Premium
            </button>
            <button class="btn-close" onclick="closePremium()">
                Close
            </button>
            <p id="paymentStatus" style="font-size:12px; margin-top:10px; opacity:0.7;"></p>
        </div>
    </div>

    <script type="module" src="script.js"></script>

    <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.BackButton.hide(); // Hide back button if not needed
    
    // 1. Open Premium Popup
    function openPremium() {
        document.getElementById('menuPanel').classList.remove('open');
        document.getElementById('premiumModal').classList.add('active');
    }

    // 2. Close Premium Popup
    function closePremium() {
        document.getElementById('premiumModal').classList.remove('active');
    }

    // 3. Process Payment
    async function goPremium() {
        const btn = document.getElementById('btnBuy');
        const statusEl = document.getElementById('paymentStatus');
        
        // Get user from Telegram Web App
        const user = tg.initDataUnsafe?.user;
        
        if (!user || !user.id) {
            statusEl.textContent = "Error: Please open in Telegram app";
            statusEl.style.color = "#ff6b6b";
            return;
        }
        
        btn.innerText = "Creating invoice...";
        btn.disabled = true;
        statusEl.textContent = "";
        
        try {
            const response = await fetch('/api/create-invoice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: user.id })
            });
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.invoice_url) {
                statusEl.textContent = "Opening payment...";
                statusEl.style.color = "#ffd700";
                
                // Open invoice in Telegram
                tg.openInvoice(data.invoice_url, function(status) {
                    if (status === 'paid') {
                        tg.showPopup({
                            title: "Success! 🎉",
                            message: "Thank you for upgrading to Premium!",
                            buttons: [{ type: "ok" }]
                        });
                        localStorage.setItem("isPremium", "true");
                        closePremium();
                        statusEl.textContent = "Payment successful!";
                        statusEl.style.color = "#66ffb2";
                    } else if (status === 'cancelled') {
                        statusEl.textContent = "Payment cancelled";
                        statusEl.style.color = "#ffa500";
                    } else if (status === 'failed') {
                        statusEl.textContent = "Payment failed";
                        statusEl.style.color = "#ff6b6b";
                    }
                });
            } else {
                throw new Error("No invoice URL received");
            }
        } catch (error) {
            console.error("Payment Error:", error);
            statusEl.textContent = `Error: ${error.message}`;
            statusEl.style.color = "#ff6b6b";
            
            tg.showPopup({
                title: "Error",
                message: "Failed to create payment. Please try again.",
                buttons: [{ type: "ok" }]
            });
        } finally {
            btn.innerText = "Go Premium";
            btn.disabled = false;
            setTimeout(() => {
                statusEl.textContent = "";
            }, 5000);
        }
    }

    // Expose functions globally
    window.openPremium = openPremium;
    window.closePremium = closePremium;
    window.goPremium = goPremium;

    // Initialize user on load
    document.addEventListener('DOMContentLoaded', function() {
        const user = tg.initDataUnsafe?.user;
        if (user) {
            console.log("Telegram User ID:", user.id);
            // You can store this in localStorage for later use
            localStorage.setItem("telegramUserId", user.id);
        }
    });
        </script>
    
</body>
</html>

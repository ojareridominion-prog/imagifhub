<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ImagifHub Premium</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: rgba(0,0,0,0.6);
      border-radius: 16px;
      padding: 24px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .price {
      margin: 20px 0;
      font-size: 18px;
    }

    .old-price {
      text-decoration: line-through;
      opacity: 0.6;
      margin-right: 8px;
    }

    .new-price {
      font-size: 28px;
      font-weight: bold;
      color: #ffd700;
    }

    ul {
      text-align: left;
      padding-left: 20px;
      margin: 20px 0;
    }

    li {
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }

    .premium-btn {
      background: #ffd700;
      color: #000;
      font-weight: bold;
    }

    .back-btn {
      background: transparent;
      color: #ccc;
      border: 1px solid #444;
    }

    .note {
      font-size: 12px;
      opacity: 0.7;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>✨ ImagifHub Premium</h1>

    <div class="price">
      <span class="old-price">200 Stars</span>
      <span class="new-price">149 Stars / 30 days</span>
    </div>

    <ul>
      <li>🚫 No ads</li>
      <li>✅ Supports imagifhub</li>
    </ul>

    <button class="premium-btn" onclick="goPremium()">
      Go Premium
    </button>

    <button class="back-btn" onclick="goBack()">
      ← Back
    </button>

    <div class="note">
      Subscription renews every 30 days.<br />
      Cancel anytime.
    </div>
  </div>

  <script>
    function goPremium() {
      //alert("Premium is coming soon 🚀");
      // Later:
       window.location.href = "/api/create-stars-invoice.js";
    }

    function goBack() {
      window.location.href = "index.html";
    }
  </script>
  <script src="premium.js"></script>
  
</body>
</html>
